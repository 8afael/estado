# Site de resultados (pasta dashboard/) servido pelo container "resultados".
# As chamadas a /api/dashboard/ são repassadas ao container da API, então o
# site e a API ficam no mesmo endereço (sem CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/javascript text/css text/csv image/svg+xml;

    # API pública do dashboard -> container "api"
    location /api/dashboard/ {
        proxy_pass http://api:9000/api/dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # dados e scripts: o navegador sempre confere se há versão nova
    location ~* \.(json|geojson|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
