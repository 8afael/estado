name: estado

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "9000",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:9010:9000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
