name: estado

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "9000",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:9010:9000"
    environment:
      - PYTHONUNBUFFERED=1
      # origens que podem ler a API pública do site de resultados (separadas por vírgula)
      - DASHBOARD_ORIGINS=https://politeiaconecta.org
    restart: unless-stopped

  # site de resultados (pasta dashboard/) + repasse de /api/dashboard para a API
  resultados:
    build:
      context: .
      dockerfile: Dockerfile.resultados
    depends_on:
      - api
    ports:
      - "127.0.0.1:9011:80"
    restart: unless-stopped
